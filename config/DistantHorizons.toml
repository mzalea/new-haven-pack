# New Haven client override: silence Distant Horizons' chat warnings.
# DH merges this with its generated defaults (keys not listed keep DH defaults).
# The GC warning is also fixed at the root by the ZGC JVM flags on the instance.
[common.logging.warning]
	showGarbageCollectorWarning = false
	showExplicitGcDisabledWarning = false
	showHighVanillaRenderDistanceWarning = false
	showPoolInsufficientMemoryWarning = false
	showUpdateQueueOverloadedChatWarning = false

# "Nice but light" defaults: 96-chunk LODs (not 256), lighter resolution, gentle
# far fog to blend the distant tree blobs. Pairs with vanilla renderDistance 16.
[client.advanced.graphics.quality]
	lodChunkRenderDistanceRadius = 96
	maxHorizontalResolution = "FOUR_BLOCKS"
	verticalQuality = "MEDIUM"

[client.advanced.graphics.fog]
	enableDhFog = true
	farFogStart = "0.85"
	farFogDensity = "2.5"
