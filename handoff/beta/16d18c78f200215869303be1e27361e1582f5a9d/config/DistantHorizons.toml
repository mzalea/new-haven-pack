# New Haven client override for Distant Horizons.
# DH ships INSTALLED BUT DORMANT — rendering off by default. The 1.21.1 beta LODs
# look rough, so players opt in via DH's settings (Advanced > Debugging > renderer,
# or F6) when they want it. This is the LAST change we push to this file: keeping it
# frozen means packwiz won't clobber players' own DH tweaks on future updates.
# DH merges this with its generated defaults (keys not listed keep DH defaults).
[client.advanced.debugging]
	rendererMode = "DISABLED"

[common.logging.warning]
	showGarbageCollectorWarning = false
	showExplicitGcDisabledWarning = false
	showHighVanillaRenderDistanceWarning = false
	showPoolInsufficientMemoryWarning = false
	showUpdateQueueOverloadedChatWarning = false

[client.advanced.autoUpdater]
	enableAutoUpdater = false
